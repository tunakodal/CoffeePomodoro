<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pomodoro</title>

  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="shell">
    <section class="panel left">
      <div class="coffee-stage">
        <img id="coffeeImg" class="coffee-img" src="assets/coffee_4.png" alt="Coffee progress" />

        <div class="hud">
          <div class="hud-time" id="timeText">55:00</div>
          <div class="hud-mode" id="timerSub">Focus</div>
        </div>
      </div>

      <div class="controls">
        <button class="btn primary" id="startBtn">Start</button>
        <button class="btn" id="pauseBtn" disabled>Pause</button>
        <button class="btn danger" id="restartBtn">Restart</button>
      </div>

      <div class="settings">
        <div class="field">
          <label for="focusInput">Duration</label>
          <input id="focusInput" type="number" min="1" inputmode="numeric" />
        </div>

        <div class="field">
          <label for="breakInput">Break</label>
          <input id="breakInput" type="number" min="1" inputmode="numeric" />
        </div>

        <button class="btn small" id="applyBtn">Apply</button>
      </div>
    </section>

    <section class="panel right">
      <div class="todo-head">
        <h2>Tasks</h2>
      </div>

      <form id="todoForm" class="todo-form" autocomplete="off">
        <input id="todoInput" class="todo-input" maxlength="60" placeholder="Add a task..." />
        <button class="btn small primary" type="submit">Add</button>
      </form>

      <ul id="todoList" class="todo-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
